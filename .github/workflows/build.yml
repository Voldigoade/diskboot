name: Windows build and safety tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    strategy:
      matrix:
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64
      - run: cmake --build build --config ${{ matrix.configuration }} --parallel 2
      - run: ctest --test-dir build -C ${{ matrix.configuration }} --output-on-failure
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: diskboot-${{ matrix.configuration }}
          path: |
            build/${{ matrix.configuration }}/diskboot.exe
            build/${{ matrix.configuration }}/diskboot_gui.exe
            LICENSE
            THIRD_PARTY.md
            third_party/nlohmann/LICENSE.MIT
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install clang-format==22.1.3
      - run: python scripts/check_format.py
